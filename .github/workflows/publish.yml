name: publish

# Publish to npm when a release tag is pushed (vX.Y.Z must equal the
# package.json version) or manually from the Actions UI. Requires an NPM_TOKEN
# secret with publish rights for the package; provenance comes from OIDC.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote, e.g. 0.9.3-rc.1 (empty = tag trigger only)'
        required: false
      tag:
        description: 'Dist-tag to point at that version'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'
      - 'promote-v*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    # Never publish from a fork/renamed repository, and only from main or a
    # release tag — a manual workflow_dispatch from a feature branch must not
    # publish that branch's package.json.
    if: >-
      github.repository == 'endlass/dsh-subagent-remote' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Verify tag matches package.json (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
      - name: Upgrade npm CLI (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Publish (prerelease goes to the next tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          USE_TRUSTED_PUBLISHING: ${{ vars.USE_TRUSTED_PUBLISHING }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          # 无 admin 权限时读不到 Actions 日志：把关键诊断写进 annotation（公开可读）。
          # 双模式：仓库变量 USE_TRUSTED_PUBLISHING=true 时走 GitHub OIDC（npm Trusted Publishing，免 token）；
          # 否则回退到 NPM_TOKEN secret。切换后建议删除 secret 并吊销 token。
          if [[ "${USE_TRUSTED_PUBLISHING:-}" == "true" ]]; then
            unset NODE_AUTH_TOKEN
            # 用干净的 userconfig 覆盖 setup-node 生成的 _authToken 占位行，确保 npm 走 OIDC 而不是空 token
            printf 'registry=https://registry.npmjs.org/\n' > "${RUNNER_TEMP:-/tmp}/npmrc-trusted"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP:-/tmp}/npmrc-trusted"
            echo "::notice title=publish mode::trusted publishing (GitHub OIDC, npm token not used)"
            echo "::notice title=npm cli::$(npm --version)"
            echo "::notice title=oidc endpoint::present=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
            echo "::notice title=github workflow ref::${GITHUB_WORKFLOW_REF:-${GITHUB_WORKFLOW}}"
          else
            echo "::notice title=publish mode::npm token (NPM_TOKEN secret)"
            if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
              echo "::error title=NPM_TOKEN missing::NPM_TOKEN secret 未注入：需为 Repository secret（非 Environment secret），名称精确 NPM_TOKEN"
              exit 1
            fi
            WHO="$(npm whoami 2>&1 || true)"
            echo "::notice title=npm whoami::$(printf '%s' "$WHO" | tail -n 1 | cut -c1-300)"
          fi
          echo "publishing $VERSION with tag $TAG"
          set +e
          npm publish --access public --provenance --tag "$TAG" --loglevel verbose 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            DETAIL="$(grep -E 'npm (error|ERR)' /tmp/publish.log | head -n 6 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/ /g' | cut -c1-1100)"
            echo "::error title=npm publish failed::${DETAIL:-unknown npm failure}"
            AUTHLOG="$(grep -Ei 'oidc|trusted|token exchange|ENEEDAUTH|EOTP|E401|E403|auth' /tmp/publish.log | tail -n 5 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/ /g' | cut -c1-1100)"
            echo "::error title=npm auth detail::${AUTHLOG:-no auth lines}"
            exit 1
          fi
          # 发布后校验：npm 新版本有 CDN 延迟，最多重试 6 次（~60s）再判定。
          NAME="$(node -p "require('./package.json').name")"
          FOUND=""
          for i in 1 2 3 4 5 6; do
            FOUND="$(npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            [[ "$FOUND" == "$VERSION" ]] && break
            sleep 10
          done
          if [[ "$FOUND" == "$VERSION" ]]; then
            echo "::notice title=npm published::${NAME}@${VERSION} is visible on registry.npmjs.org"
          else
            echo "::warning title=npm not visible yet::${NAME}@${VERSION} 尚未在 registry 可见（npm publish 返回 0，可能是 CDN 延迟或 staging）"
          fi

  # Promote an already published version to another dist-tag (for example move
  # `latest` onto a version that was published under `next`). Trigger either by
  # pushing a `promote-v<version>` tag (always `latest`) or from the Actions UI
  # with explicit inputs. Needs npm >= 11.21 for OIDC dist-tag and the package's
  # trusted publishing config to allow `npm dist-tag`; without that permission
  # npm answers 401/403 and this job fails loudly instead of changing anything.
  promote:
    if: >-
      github.repository == 'endlass/dsh-subagent-remote' &&
      (startsWith(github.ref, 'refs/tags/promote-v') ||
       (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target version and dist-tag
        id: target
        run: |
          if [[ "${GITHUB_REF_NAME}" == promote-v* ]]; then
            VERSION="${GITHUB_REF_NAME#promote-v}"
            TAG="latest"
          else
            VERSION="${{ inputs.version }}"
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "$VERSION" || -z "$TAG" ]]; then
            echo "::error title=promote inputs missing::version and tag are both required"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice title=promote::dsh-subagent-remote@$VERSION -> $TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm CLI (OIDC dist-tag needs npm >= 11.21)
        run: npm install -g npm@latest
      - name: Promote dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          USE_TRUSTED_PUBLISHING: ${{ vars.USE_TRUSTED_PUBLISHING }}
        run: |
          if [[ "${USE_TRUSTED_PUBLISHING:-}" == "true" ]]; then
            unset NODE_AUTH_TOKEN
            printf 'registry=https://registry.npmjs.org/\n' > "${RUNNER_TEMP:-/tmp}/npmrc-trusted"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP:-/tmp}/npmrc-trusted"
            echo "::notice title=promote mode::trusted publishing (GitHub OIDC)"
          else
            echo "::notice title=promote mode::npm token (NPM_TOKEN secret)"
          fi
          set +e
          npm dist-tag add "dsh-subagent-remote@${{ steps.target.outputs.version }}" "${{ steps.target.outputs.tag }}" 2>&1 | tee /tmp/promote.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            DETAIL="$(grep -E 'npm (error|ERR)|E401|E403' /tmp/promote.log | head -n 4 | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=dist-tag failed::${DETAIL:-unknown npm failure}"
            exit "$code"
          fi
      - name: Verify
        run: npm view dsh-subagent-remote dist-tags --json
