name: ci

# Public-repo CI: no third-party dependencies, no network, no credentials.
# The package root is this directory and every suite is a plain Node script, so
# there is nothing to install.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests (eight suites)
        run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Packaging check (npm pack --dry-run)
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs')
          const [pack] = JSON.parse(fs.readFileSync('pack.json', 'utf8'))
          const paths = pack.files.map((file) => file.path)
          const forbidden = paths.filter((path) =>
            path.startsWith('test/') ||
            path.startsWith('.github/') ||
            path.endsWith('.tgz') ||
            path.endsWith('.log') ||
            path === '.gitignore' ||
            path === '.gitattributes'
          )
          const required = [
            'index.js',
            'package.json',
            'cordis.patch.yml',
            'lib/acp.js',
            'lib/client.js',
            'lib/journal.js',
            'lib/policy.js',
            'lib/runs.js',
            'lib/settings.js',
            'lib/tool.js',
            'locale/en.json',
            'locale/zh.json',
            'LICENSE',
            'README.md',
            'README.zh.md',
            'CHANGELOG.md',
            'SECURITY.md'
          ]
          const missing = required.filter((path) => !paths.includes(path))
          if (forbidden.length > 0 || missing.length > 0) {
            console.error('packaging check failed')
            if (forbidden.length > 0) console.error('  must not ship:', forbidden.join(', '))
            if (missing.length > 0) console.error('  missing:', missing.join(', '))
            process.exit(1)
          }
          console.log(`packaging ok: ${paths.length} files, ${pack.size} bytes packed`)
          NODE
